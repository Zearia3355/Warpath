name: Release

# Two ways in:
#
#   Push a bare version tag (3.7.11)  -> package and publish.
#     No "v" prefix: the packager uses the tag verbatim as the version string,
#     so a tag of "v3.7.11" would publish on CurseForge as "v3.7.11".
#     The imported tags for 3.3.5 to 3.7.10 point at commits made before this
#     file existed, and GitHub reads the workflow from the tagged ref, so
#     pushing that history triggers nothing and cannot re-upload old releases.
#
#   Run it by hand (workflow_dispatch) -> package and upload NOTHING.
#     Passes -d, which skips every upload, and keeps the zip as an artifact so
#     the build can be checked before CurseForge exists. The packager still
#     hard-fails on a bad .pkgmeta, a missing TOC or a missing interface
#     version, which is the point of running it.
on:
  push:
    tags:
      - '[0-9]+.[0-9]+.[0-9]+'
  workflow_dispatch:

permissions:
  contents: write # create the GitHub release

jobs:
  test:
    uses: ./.github/workflows/test.yml

  release:
    name: Package and publish
    needs: test # nothing is packaged, let alone published, unless it compiles and passes
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history: the packager needs it for changelogs

      - uses: BigWigsMods/packager@v2
        with:
          # -u keeps LF in the zip. The packager converts to CRLF by default,
          # which works fine in game but would mean the released zip never
          # byte-matches the repo or an installed copy. With -u the whole
          # pipeline is LF, so "does the installed copy match the release?"
          # stays answerable with a checksum.
          # -d (manual runs only) skips every upload.
          args: ${{ github.event_name == 'workflow_dispatch' && '-d -u' || '-u' }}
        env:
          # Set CF_API_TOKEN in the repo's secrets once the CurseForge project
          # exists, and put its project id in Warpath.toc as
          # ## X-Curse-Project-ID: <id>
          # Until both exist the CurseForge step is skipped with a warning
          # rather than failing.
          CF_API_TOKEN: ${{ secrets.CF_API_TOKEN }}
          # Provided automatically by Actions; also attaches the zip to the
          # GitHub release, so there is always a copy outside CurseForge.
          GH_API_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Show what was built
        if: github.event_name == 'workflow_dispatch'
        run: ls -la .release/

      - name: Keep the package for inspection
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: warpath-validation-build
          path: .release/*.zip
          # The packager builds into .release, a dot-directory, and
          # upload-artifact treats anything under one as hidden and skips it.
          include-hidden-files: true
          # Fail the run if the packager produced no zip: silence would
          # otherwise look like success.
          if-no-files-found: error
